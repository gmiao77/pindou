  <style>
    :root { --ink:#5a3153; --pink:#ff6da8; --hot:#ff3f88; --cream:#fff8fa; --card:#fff; --line:#f5d8e5; --lav:#9d7bf4; }
    *{box-sizing:border-box} body{margin:0; min-height:100vh; color:var(--ink); background:#fff4f8; font-family:"Noto Sans SC",sans-serif;}
    body:before, body:after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(1px);opacity:.55} body:before{width:440px;height:440px;background:#ffd4e5;top:-180px;left:-100px} body:after{width:440px;height:440px;background:#e3d8ff;right:-100px;bottom:-150px}
    .wrap{max-width:1240px;margin:auto;padding:0 28px 48px}.nav{height:82px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;font:800 27px/1 "Baloo 2",sans-serif;letter-spacing:.5px}.brand-mark{width:43px;height:43px;border-radius:15px;background:linear-gradient(145deg,#ff6ba8,#ff9ac3);display:grid;place-items:center;box-shadow:0 6px 0 #ef4e91;color:#fff;font-size:23px}.brand em{color:var(--pink);font-style:normal}.nav-right{display:flex;gap:10px;align-items:center}.nav-pill{border:0;background:#fff;color:#945776;padding:10px 15px;border-radius:99px;font:600 14px inherit;box-shadow:0 4px 14px #f2d2df80}.avatar{width:37px;height:37px;border:3px solid #fff;border-radius:50%;background:linear-gradient(135deg,#f8c0dc,#be9ff5);box-shadow:0 2px 8px #dca2bb}

    .workspace{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;margin-top:24px}.card{background:#ffffffde;border:1px solid #fff;border-radius:25px;box-shadow:0 10px 30px #c5749d1c;padding:24px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 17px;font:800 20px "Baloo 2",sans-serif}.badge{background:#fff0f6;color:#ee5794;border-radius:12px;padding:5px 10px;font:700 12px inherit}
    .dropzone{position:relative;display:flex;gap:18px;align-items:center;min-height:144px;border:2px dashed #f4a8c6;border-radius:20px;background:linear-gradient(135deg,#fff8fb,#fff3f8);padding:20px;transition:.2s}.dropzone.drag{background:#ffe5f0;border-color:#ff69a2;transform:scale(1.01)}.upload-icon{flex:0 0 66px;height:66px;border-radius:21px;display:grid;place-items:center;background:#ffd9e8;color:#ff5a9d;font-size:31px}.dropzone h3{font-size:16px;margin:0 0 6px}.dropzone p{font-size:12px;color:#a98598;margin:0}.file-btn{margin-top:11px;border:0;border-radius:10px;padding:8px 13px;background:#fff;color:#ec5c98;font:700 12px inherit;box-shadow:0 3px 9px #efb7ce}.file-btn:hover,.primary:hover{transform:translateY(-1px)}#imageUpload{position:absolute;inset:0;opacity:0;cursor:pointer}
    .controls{display:flex;align-items:center;gap:14px;margin-top:18px;padding-top:17px;border-top:1px solid #fae5ee}.control-label{font-weight:700;font-size:14px;white-space:nowrap}.segmented{display:flex;background:#f8edf3;padding:4px;border-radius:13px;gap:3px}.segmented button{border:0;border-radius:9px;padding:6px 10px;background:transparent;color:#966d81;font:600 12px inherit;cursor:pointer}.segmented button.active{background:#fff;color:#ed4e91;box-shadow:0 2px 7px #d89aaf55}.range{accent-color:#ff5a99;width:100%}.range-val{color:#f25291;font:800 14px "Baloo 2"}.primary{border:0;border-radius:14px;color:#fff;background:linear-gradient(135deg,#ff5596,#ff76ad);padding:11px 18px;font:800 14px inherit;box-shadow:0 5px 0 #e74685,0 9px 17px #ed79a488;cursor:pointer;transition:.15s;white-space:nowrap}
    .preview-card{padding:22px}.canvas-wrap{height:388px;border-radius:20px;background:#fff9fc;display:grid;place-items:center;overflow:hidden;position:relative}.canvas-wrap:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#f4d5e2 1px,transparent 1px);background-size:14px 14px;opacity:.45}#beadCanvas{position:relative;z-index:1;max-width:95%;max-height:95%;image-rendering:pixelated;filter:drop-shadow(0 8px 7px #c987a844)}.canvas-label{position:absolute;z-index:2;bottom:12px;right:14px;border-radius:8px;background:#fff;padding:5px 8px;color:#aa7891;font-size:11px;box-shadow:0 2px 7px #dda5bb55}.preview-actions{display:flex;gap:10px;margin-top:17px}.outline{flex:1;border:1px solid #f3b2cc;background:white;color:#e85791;border-radius:12px;font:700 13px inherit;padding:10px;cursor:pointer}.outline:hover{background:#fff3f7}.stat{background:#fdf0f6;border-radius:12px;padding:7px 10px;font-size:12px;color:#9f7087;white-space:nowrap}.stat b{font-size:16px;color:#ec5995}
    .bottom{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;margin-top:22px}.palette-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.color-row{border:1px solid #f7dfe9;border-radius:15px;padding:10px;cursor:pointer;transition:.16s;background:#fff}.color-row:hover{border-color:#ef83b0;transform:translateY(-2px)}.color-row.active{box-shadow:0 0 0 2px #ff68a4;background:#fff7fa}.swatch{height:22px;border-radius:8px;margin-bottom:7px;box-shadow:inset 0 -3px 0 #0002}.color-row b{display:block;font:800 12px "Baloo 2"}.color-row span{font-size:10px;color:#a47b90}.color-tools{display:flex;gap:8px;align-items:center;margin-bottom:15px}.color-tools input{width:32px;height:32px;border:0;padding:0;background:none;cursor:pointer}.hint{font-size:12px;color:#a17b8f}.legend{display:flex;gap:8px;flex-wrap:wrap}.legend-item{display:flex;align-items:center;gap:6px;background:#fff6f9;border-radius:10px;padding:7px 9px;font-size:11px;color:#8d6277}.dot{width:12px;height:12px;border-radius:4px;box-shadow:inset 0 -2px #0002}.count-table{width:100%;border-collapse:collapse;font-size:13px}.count-table th{text-align:left;color:#b18a9d;font-size:11px;padding:0 0 10px}.count-table td{padding:9px 0;border-top:1px dashed #f2dbe5}.code{font:800 13px "Baloo 2";color:#6b3d61}.total{margin-top:13px;border-radius:14px;background:linear-gradient(100deg,#fff0f6,#f8f0ff);padding:12px;display:flex;align-items:center;justify-content:space-between;font-size:13px}.total strong{font:800 22px "Baloo 2";color:#f05191}.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,100px);background:#5d3858;color:#fff;border-radius:99px;padding:11px 18px;font-size:13px;box-shadow:0 8px 20px #4a234644;transition:.25s;z-index:10}.toast.show{transform:translate(-50%,0)}
    @media(max-width:850px){.workspace,.bottom{grid-template-columns:1fr}.hero{height:190px}.canvas-wrap{height:330px}}@media(max-width:560px){.wrap{padding:0 15px 28px}.nav{height:68px}.nav-pill{display:none}.hero{padding:28px 24px}.hero h1{font-size:28px}.workspace{margin-top:15px;gap:15px}.card{padding:18px}.controls{flex-wrap:wrap}.primary{width:100%}.palette-grid{grid-template-columns:repeat(3,1fr)}.canvas-wrap{height:285px}}
  </style>
</head>
<body>
  <main class="wrap">
    <nav class="nav"><div class="brand"><span class="brand-mark">✿</span>豆豆<em>魔法屋</em></div><div class="nav-right"><button class="nav-pill">我的作品 ✦</button><button class="nav-pill">使用指南</button><span class="avatar"></span></div></nav>
    <section class="hero"><h1>把灵感，变成一颗颗小豆豆 ✨</h1><p>上传喜欢的图片，一键生成专属拼豆图纸吧！</p><span class="bubble"></span><span class="bubble small"></span><span class="star">✦</span></section>
    <section class="workspace">
      <div class="card">
        <h2 class="section-title">① 上传图片 <span class="badge">开始创作</span></h2>
        <label class="dropzone" id="dropzone"><div class="upload-icon">☁</div><div><h3>拖入图片，或点击这里上传</h3><p>支持 JPG、PNG、WEBP 格式，建议使用主体清晰的图片</p><button type="button" class="file-btn">选择一张图片</button></div><input id="imageUpload" type="file" accept="image/*"></label>
        <div class="controls"><span class="control-label">拼豆尺寸</span><div class="segmented" id="sizeButtons"><button data-size="18">迷你</button><button data-size="24" class="active">标准</button><button data-size="32">精细</button></div><span class="control-label">颗粒密度</span><input class="range" id="density" type="range" min="16" max="36" value="24"><span class="range-val" id="densityVal">24 × 24</span><button class="primary" id="generateBtn">生成拼豆图 ✦</button></div>
      </div>
      <div class="card preview-card"><h2 class="section-title">② 拼豆预览 <span class="stat">共 <b id="beadTotal">576</b> 颗</span></h2><div class="canvas-wrap"><canvas id="beadCanvas" width="480" height="480"></canvas><span class="canvas-label">可点击色号替换颜色</span></div><div class="preview-actions"><button class="outline" id="downloadBtn">⇩ 保存图纸</button><button class="outline" id="randomBtn">↻ 重新生成</button></div></div>
    </section>
    <section class="bottom">
      <div class="card"><h2 class="section-title">③ 我的拼豆色盘 <span class="badge" id="colorTip">点击色号可替换</span></h2><div class="color-tools"><span class="hint">当前编辑：</span><b id="selectedLabel">A1</b><input id="colorPicker" type="color" value="#FAF4C8"><span class="hint">选择新颜色后自动同步</span></div><div class="palette-grid" id="paletteGrid"></div></div>
      <div class="card"><h2 class="section-title">④ 色号用量清单 <span class="badge">准备材料</span></h2><table class="count-table"><thead><tr><th>拼豆色号</th><th>颜色</th><th>数量</th></tr></thead><tbody id="countBody"></tbody></table><div class="total"><span>预计需要拼豆</span><strong id="totalBottom">576 颗</strong><span>建议多备 5%</span></div></div>
    </section>
  </main><div class="toast" id="toast"></div>
  <script>
    const palettes = `A1 #FAF4C8|A10 #F77C31|A11 #FFDD99|A12 #FE9F72|A13 #FFC365|A14 #FD543D|A15 #FFF365|A16 #FFFF9F|A17 #FFE36E|A18 #FEBE7D|A19 #FD7C72|A2 #FFFFD5|A20 #FFD568|A21 #FFE395|A22 #F4F57D|A23 #E6C9B7|A24 #F7F8A2|A25 #FFD67D|A26 #FFC830|A3 #FEFF8B|A4 #FBED56|A5 #F4D738|A6 #FEAC4C|A7 #FE8B4C|A8 #FFDA45|A9 #FF995B
B1 #E6EE31|B10 #95D3C2|B11 #5D722A|B12 #166F41|B13 #CAEB7B|B14 #ADE946|B15 #2E5132|B16 #C5ED9C|B17 #9BB13A|B18 #E6EE49|B19 #24B88C|B2 #63F347|B20 #C2F0CC|B21 #156A6B|B22 #0B3C43|B23 #303A21|B24 #EEFCA5|B25 #4E846D|B26 #8D7A35|B27 #CCE1AF|B28 #9EE5B9|B29 #C5E254|B3 #9EF780|B30 #E2FCB1|B31 #B0E792|B32 #9CAB5A|B4 #5DE035|B5 #35E352|B6 #65E2A6|B7 #3DAF80|B8 #1C9C4F|B9 #27523A
C1 #E8FFE7|C10 #3EBCE2|C11 #28DDDE|C12 #1C334D|C13 #CDE8FF|C14 #D5FDFF|C15 #22C4C6|C16 #1557A8|C17 #04D1F6|C18 #1D3344|C19 #1887A2|C2 #A9F9FC|C20 #176DAF|C21 #BEDDFF|C22 #67B4BE|C23 #C8E2FF|C24 #7CC4FF|C25 #A9E5E5|C26 #3CAED8|C27 #D3DFFA|C28 #BBCFED|C29 #34488E|C3 #A0E2FB|C4 #41CCFF|C5 #01ACEB|C6 #50AAF0|C7 #3677D2|C8 #0F54C0|C9 #324BCA
D1 #AEB4F2|D10 #361851|D11 #B9BAE1|D12 #DE9AD4|D13 #B90095|D14 #8B279B|D15 #2F1F90|D16 #E3E1EE|D17 #C4D4F6|D18 #A45EC7|D19 #D8C3D7|D2 #858EDD|D20 #9C32B2|D21 #9A009B|D22 #333A95|D23 #EBDAFC|D24 #7786E5|D25 #494FC7|D26 #DFC2F8|D3 #2F54AF|D4 #182A84|D5 #B843C5|D6 #AC7BDE|D7 #8854B3|D8 #E2D3FF|D9 #D5B9F8
E1 #FDD3CC|E10 #D33793|E11 #FCDDD2|E12 #F78FC3|E13 #B5006D|E14 #FFD1BA|E15 #F8C7C9|E16 #FFF3EB|E17 #FFE2EA|E18 #FFC7DB|E19 #FEBAD5|E2 #FEC0DF|E20 #D8C7D1|E21 #BD9DA1|E22 #B785A1|E23 #937A8D|E24 #E1BCE8|E3 #FFB7E7|E4 #E8649E|E5 #F551A2|E6 #F13D74|E7 #C63478|E8 #FFDBE9|E9 #E970CC
F1 #FD957B|F10 #8A4526|F11 #5A2121|F12 #FD4E6A|F13 #F35744|F14 #FFA9AD|F15 #D30022|F16 #FEC2A6|F17 #E69C79|F18 #D37C46|F19 #C1444A|F2 #FC3D46|F20 #CD9391|F21 #F7B4C6|F22 #FDC0D0|F23 #F67E66|F24 #E698AA|F25 #E54B4F|F3 #F74941|F4 #FC283C|F5 #E7002F|F6 #943630|F7 #971937|F8 #BC0028|F9 #E2677A
G1 #FFE2CE|G10 #D98C39|G11 #E0C593|G12 #FFC890|G13 #B7714A|G14 #8D614C|G15 #FCF9E0|G16 #F2D9BA|G17 #78524B|G18 #FFE4CC|G19 #E07935|G2 #FFC4AA|G20 #A94023|G21 #B88558|G3 #F4C3A5|G4 #E1B383|G5 #EDB045|G6 #E99C17|G7 #9D5B3E|G8 #753832|G9 #E6B483
H1 #FDFBFF|H10 #EEE9EA|H11 #CECDD5|H12 #FFF5ED|H13 #F5ECD2|H14 #CFD7D3|H15 #98A6A8|H16 #1D1414|H17 #F1EDED|H18 #FFFDF0|H19 #F6EFE2|H2 #FEFFFF|H20 #949FA3|H21 #FFFBE1|H22 #CACAD4|H23 #9A9D94|H3 #B6B1BA|H4 #89858C|H5 #48464E|H6 #2F2B2F|H7 #000000|H8 #E7D6DB|H9 #EDEDED
M1 #BCC6B8|M10 #C5B2BC|M11 #9F7594|M12 #644749|M13 #D19066|M14 #C77362|M15 #757D78|M2 #8AA386|M3 #697D80|M4 #E3D2BC|M5 #D0CCAA|M6 #B0A782|M7 #B4A497|M8 #B38281|M9 #A58767`.split('|').map(entry=>{const [id,color]=entry.trim().split(/\s+/);return {id,name:id,color}});
    let size=24, selected=0, sourceImage=null; const canvas=document.getElementById('beadCanvas'), ctx=canvas.getContext('2d');
    const $=s=>document.querySelector(s); const showToast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)};
    function paintDefault(){ const n=size, cell=canvas.width/n; ctx.clearRect(0,0,480,480); for(let y=0;y<n;y++) for(let x=0;x<n;x++){ const dx=x-n/2,dy=y-n/2; let i=(x+y)%8; if((dx*dx/1.3+dy*dy)<(n*n*.16))i=0; else if(y>n*.66)i=7; else if(x<n*.24&&y<n*.33)i=3; else if(x>n*.74&&y<n*.4)i=6; drawBead(x*cell,y*cell,cell,palettes[i].color) } updateCounts(); }
    function drawBead(x,y,c,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x+1,y+1,c-2,c-2,Math.max(2,c*.25));ctx.fill();ctx.fillStyle='#fff5';ctx.beginPath();ctx.arc(x+c*.36,y+c*.32,c*.16,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#00000018';ctx.lineWidth=1;ctx.stroke()}
    function drawFromImage(){if(!sourceImage)return paintDefault();const n=size, cell=480/n, off=document.createElement('canvas');off.width=off.height=n;const o=off.getContext('2d'); const ratio=Math.max(n/sourceImage.width,n/sourceImage.height);const w=sourceImage.width*ratio,h=sourceImage.height*ratio;o.drawImage(sourceImage,(n-w)/2,(n-h)/2,w,h);const data=o.getImageData(0,0,n,n).data;ctx.clearRect(0,0,480,480); for(let y=0;y<n;y++)for(let x=0;x<n;x++){let k=(y*n+x)*4,r=data[k],g=data[k+1],b=data[k+2], best=0,min=1e9;palettes.forEach((p,i)=>{let h=p.color.slice(1);let pr=parseInt(h.slice(0,2),16),pg=parseInt(h.slice(2,4),16),pb=parseInt(h.slice(4),16);let d=(r-pr)**2+(g-pg)**2+(b-pb)**2;if(d<min){min=d;best=i}});drawBead(x*cell,y*cell,cell,palettes[best].color)}updateCounts()}
    function updateCounts(){const data=ctx.getImageData(0,0,480,480).data, counts=palettes.map(()=>0);const n=size,cell=480/n;for(let y=0;y<n;y++)for(let x=0;x<n;x++){let k=(Math.floor(y*cell+.5)*480+Math.floor(x*cell+.5))*4, best=0,min=1e9;palettes.forEach((p,i)=>{let h=p.color.slice(1),d=(data[k]-parseInt(h.slice(0,2),16))**2+(data[k+1]-parseInt(h.slice(2,4),16))**2+(data[k+2]-parseInt(h.slice(4),16))**2;if(d<min){min=d;best=i}});counts[best]++} $('#countBody').innerHTML=palettes.filter((p,i)=>counts[i]).map((p)=>`<tr><td class="code">${p.id}</td><td><span class="legend-item"><i class="dot" style="background:${p.color}"></i>${p.name}</span></td><td><b>${counts[palettes.indexOf(p)]} 颗</b></td></tr>`).join('');let total=n*n;$('#beadTotal').textContent=total;$('#totalBottom').textContent=total+' 颗';renderPalette()}
    function renderPalette(){ $('#paletteGrid').innerHTML=palettes.map((p,i)=>`<div class="color-row ${i===selected?'active':''}" data-index="${i}"><div class="swatch" style="background:${p.color}"></div><b>${p.id}</b><span>${p.color}</span></div>`).join('');document.querySelectorAll('.color-row').forEach(e=>e.onclick=()=>{selected=+e.dataset.index;$('#selectedLabel').textContent=palettes[selected].id;$('#colorPicker').value=palettes[selected].color;renderPalette()}) }
    $('#colorPicker').oninput=e=>{palettes[selected].color=e.target.value;drawFromImage();showToast(`${palettes[selected].id} 的颜色已更新`)};
    $('#density').oninput=e=>{size=+e.target.value;$('#densityVal').textContent=size+' × '+size;drawFromImage()};
    $('#sizeButtons').onclick=e=>{if(e.target.tagName==='BUTTON'){size=+e.target.dataset.size;$('#density').value=size;$('#densityVal').textContent=size+' × '+size;document.querySelectorAll('#sizeButtons button').forEach(b=>b.classList.toggle('active',b===e.target));drawFromImage()}};
    $('#imageUpload').onchange=e=>{let f=e.target.files[0];if(!f)return;let img=new Image;img.onload=()=>{sourceImage=img;drawFromImage();showToast('图片已加载，拼豆图生成成功！')};img.src=URL.createObjectURL(f)};
    const dz=$('#dropzone');['dragenter','dragover'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add('drag')}));['dragleave','drop'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove('drag')}));dz.addEventListener('drop',e=>{let f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image/')){$('#imageUpload').files=e.dataTransfer.files;$('#imageUpload').dispatchEvent(new Event('change'))}});
    $('#generateBtn').onclick=()=>{drawFromImage();showToast(sourceImage?'拼豆图已重新生成！':'已为你生成可爱的示例图！')};$('#randomBtn').onclick=()=>{drawFromImage();showToast('已按当前官方色号重新生成！')};$('#downloadBtn').onclick=()=>{let a=document.createElement('a');a.download='我的拼豆图.png';a.href=canvas.toDataURL();a.click();showToast('图纸已保存到本地')}; paintDefault();
  </script>
</body>
