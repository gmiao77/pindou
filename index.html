    .preview-card{padding:28px}

<body>
  <main class="wrap">
    <nav class="nav"><div class="brand"><span class="brand-mark">✿</span>豆豆<em>魔法屋</em></div><div class="nav-right"><button class="nav-pill">我的作品 ✦</button><button class="nav-pill">使用指南</button><span class="avatar"></span></div></nav>
    <section class="hero"><h1>把灵感，变成一颗颗小豆豆 ✨</h1><p>上传喜欢的图片，一键生成专属拼豆图纸吧！</p><span class="bubble"></span><span class="bubble small"></span><span class="star">✦</span></section>
    
    <div class="workspace">
      <!-- 第1步：设置区 -->
      <section class="card">
        <h2 class="section-title">① 上传图片 <span class="badge">开始创作</span></h2>
        <label class="dropzone" id="dropzone"><div class="upload-icon">☁</div><div><h3>拖入图片，或点击这里上传</h3><p>支持 JPG、PNG、WEBP 格式，建议使用主体清晰的图片</p><button type="button" class="file-btn">选择一张图片</button></div><input id="imageUpload" type="file" accept="image/*"></label>
        <div class="source-preview" id="sourcePreview" aria-live="polite"><img id="sourceImagePreview" alt="原始上传图片预览"><div><b>原始图片预览</b><span id="sourceImageInfo">将以此图片生成拼豆图</span><span class="source-note">仅图像外围白色 / 浅灰背景不会计入拼豆</span></div></div>
        <div class="controls">
          <span class="control-label">拼豆尺寸</span>
          <div class="segmented" id="sizeButtons">
            <button data-size="26" class="active">26格</button>
            <button data-size="36">36格</button>
            <button data-size="52">52格</button>
            <button data-size="78">78格</button>
            <button data-size="104">104格</button>
          </div>
          <span class="control-label">颗粒密度</span>
          <input class="range" id="density" type="range" min="26" max="104" value="26"><span class="range-val" id="densityVal">26 × 26</span>
          <button class="primary" id="generateBtn">生成拼豆图 ✦</button>
        </div>
      </section>

      <!-- 第2步：大视野预览及编辑区 -->
      <section class="card preview-card">
        <h2 class="section-title">② 拼豆预览及修改 <span class="stat">共 <b id="beadTotal">676</b> 颗</span></h2>
        <div class="canvas-wrap">
            <canvas id="beadCanvas"></canvas>
            <span class="canvas-label">拖动浏览 · 点击色号可单点替换</span>
        </div>
        <div class="zoom-control"><span>预览缩放</span><input id="previewZoom" type="range" min="30" max="250" value="72" aria-label="预览缩放"><b id="zoomValue">72%</b></div>
        <div class="preview-editor empty" id="previewEditor"><span>点击拼豆预览中的圆形色号，即可替换该拼豆颜色</span></div>
        <div class="preview-actions"><button class="outline" id="downloadBtn">⇩ 保存图纸</button><button class="outline" id="randomBtn">↻ 重新生成</button></div>
      </section>

      <!-- 第3步：材料区 -->
      <section class="card">
        <h2 class="section-title">③ 色号用量清单 <span class="badge">准备材料</span></h2>
        <table class="count-table"><thead><tr><th>拼豆色号</th><th>颜色</th><th>数量</th></tr></thead><tbody id="countBody"></tbody></table>
        <div class="total"><span>预计需要拼豆</span><strong id="totalBottom">676 颗</strong><span>建议多备 5%</span></div>
      </section>
    </div>
  </main><div class="toast" id="toast"></div>
  <script>
    const palettes = `A1 #FAF4C8|A10 #F77C31|A11 #FFDD99|A12 #FE9F72|A13 #FFC365|A14 #FD543D|A15 #FFF365|A16 #FFFF9F|A17 #FFE36E|A18 #FEBE7D|A19 #FD7C72|A2 #FFFFD5|A20 #FFD568|A21 #FFE395|A22 #F4F57D|A23 #E6C9B7|A24 #F7F8A2|A25 #FFD67D|A26 #FFC830|A3 #FEFF8B|A4 #FBED56|A5 #F4D738|A6 #FEAC4C|A7 #FE8B4C|A8 #FFDA45|A9 #FF995B
B1 #E6EE31|B10 #95D3C2|B11 #5D722A|B12 #166F41|B13 #CAEB7B|B14 #ADE946|B15 #2E5132|B16 #C5ED9C|B17 #9BB13A|B18 #E6EE49|B19 #24B88C|B2 #63F347|B20 #C2F0CC|B21 #156A6B|B22 #0B3C43|B23 #303A21|B24 #EEFCA5|B25 #4E846D|B26 #8D7A35|B27 #CCE1AF|B28 #9EE5B9|B29 #C5E254|B3 #9EF780|B30 #E2FCB1|B31 #B0E792|B32 #9CAB5A|B4 #5DE035|B5 #35E352|B6 #65E2A6|B7 #3DAF80|B8 #1C9C4F|B9 #27523A
C1 #E8FFE7|C10 #3EBCE2|C11 #28DDDE|C12 #1C334D|C13 #CDE8FF|C14 #D5FDFF|C15 #22C4C6|C16 #1557A8|C17 #04D1F6|C18 #1D3344|C19 #1887A2|C2 #A9F9FC|C20 #176DAF|C21 #BEDDFF|C22 #67B4BE|C23 #C8E2FF|C24 #7CC4FF|C25 #A9E5E5|C26 #3CAED8|C27 #D3DFFA|C28 #BBCFED|C29 #34488E|C3 #A0E2FB|C4 #41CCFF|C5 #01ACEB|C6 #50AAF0|C7 #3677D2|C8 #0F54C0|C9 #324BCA
D1 #AEB4F2|D10 #361851|D11 #B9BAE1|D12 #DE9AD4|D13 #B90095|D14 #8B279B|D15 #2F1F90|D16 #E3E1EE|D17 #C4D4F6|D18 #A45EC7|D19 #D8C3D7|D2 #858EDD|D20 #9C32B2|D21 #9A009B|D22 #333A95|D23 #EBDAFC|D24 #7786E5|D25 #494FC7|D26 #DFC2F8|D3 #2F54AF|D4 #182A84|D5 #B843C5|D6 #AC7BDE|D7 #8854B3|D8 #E2D3FF|D9 #D5B9F8
E1 #FDD3CC|E10 #D33793|E11 #FCDDD2|E12 #F78FC3|E13 #B5006D|E14 #FFD1BA|E15 #F8C7C9|E16 #FFF3EB|E17 #FFE2EA|E18 #FFC7DB|E19 #FEBAD5|E2 #FEC0DF|E20 #D8C7D1|E21 #BD9DA1|E22 #B785A1|E23 #937A8D|E24 #E1BCE8|E3 #FFB7E7|E4 #E8649E|E5 #F551A2|E6 #F13D74|E7 #C63478|E8 #FFDBE9|E9 #E970CC
F1 #FD957B|F10 #8A4526|F11 #5A2121|F12 #FD4E6A|F13 #F35744|F14 #FFA9AD|F15 #D30022|F16 #FEC2A6|F17 #E69C79|F18 #D37C46|F19 #C1444A|F2 #FC3D46|F20 #CD9391|F21 #F7B4C6|F22 #FDC0D0|F23 #F67E66|F24 #E698AA|F25 #E54B4F|F3 #F74941|F4 #FC283C|F5 #E7002F|F6 #943630|F7 #971937|F8 #BC0028|F9 #E2677A
G1 #FFE2CE|G10 #D98C39|G11 #E0C593|G12 #FFC890|G13 #B7714A|G14 #8D614C|G15 #FCF9E0|G16 #F2D9BA|G17 #78524B|G18 #FFE4CC|G19 #E07935|G2 #FFC4AA|G20 #A94023|G21 #B88558|G3 #F4C3A5|G4 #E1B383|G5 #EDB045|G6 #E99C17|G7 #9D5B3E|G8 #753832|G9 #E6B483
H1 #FDFBFF|H10 #EEE9EA|H11 #CECDD5|H12 #FFF5ED|H13 #F5ECD2|H14 #CFD7D3|H15 #98A6A8|H16 #1D1414|H17 #F1EDED|H18 #FFFDF0|H19 #F6EFE2|H2 #FEFFFF|H20 #949FA3|H21 #FFFBE1|H22 #CACAD4|H23 #9A9D94|H3 #B6B1BA|H4 #89858C|H5 #48464E|H6 #2F2B2F|H7 #000000|H8 #E7D6DB|H9 #EDEDED
M1 #BCC6B8|M10 #C5B2BC|M11 #9F7594|M12 #644749|M13 #D19066|M14 #C77362|M15 #757D78|M2 #8AA386|M3 #697D80|M4 #E3D2BC|M5 #D0CCAA|M6 #B0A782|M7 #B4A497|M8 #B38281|M9 #A58767`.replace(/\s*\n\s*/g,'|').split('|').map(entry=>{const [id,color]=entry.trim().split(/\s+/);return {id,name:id,color}});
    
    const BASE_VISUAL_SIZE = 780; 
    const BEAD_RENDER_SIZE = 30;
    
    let size=26, selectedBeadPos=null, sourceImage=null, beadIndices=[], previewZoom=72;
    const canvas=document.getElementById('beadCanvas'), ctx=canvas.getContext('2d');
    const $=s=>document.querySelector(s);
    const showToast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)};
    const hexToRgb=color=>[parseInt(color.slice(1,3),16),parseInt(color.slice(3,5),16),parseInt(color.slice(5,7),16)];
    const paletteRgb=()=>palettes.map(p=>hexToRgb(p.color));

    const getContrastYIQ = hex => {
      const r = parseInt(hex.substring(1, 3), 16);
      const g = parseInt(hex.substring(3, 5), 16);
      const b = parseInt(hex.substring(5, 7), 16);
      const yiq = (r * 299 + g * 587 + b * 114) / 1000;
      return yiq >= 128 ? '#222222' : '#ffffff';
    };

    function drawBead(x,y,cell,palette){
      const cx=x+cell/2, cy=y+cell/2, radius=Math.max(1,cell*.47);
      ctx.fillStyle=palette.color; ctx.beginPath(); ctx.arc(cx,cy,radius,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#0000001a'; ctx.lineWidth=Math.max(.4,cell*.04); ctx.stroke();
      ctx.fillStyle=getContrastYIQ(palette.color); 
      ctx.font=`700 ${Math.max(8,cell*.28)}px "Baloo 2", sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(palette.id,cx,cy+cell*.03);
    }

    function redrawBeads(){
      const renderSize = size * BEAD_RENDER_SIZE;
      canvas.width = renderSize; canvas.height = renderSize;
      
      canvas.style.width = `${BASE_VISUAL_SIZE * previewZoom / 100}px`; 
      canvas.style.height = `${BASE_VISUAL_SIZE * previewZoom / 100}px`;
      
      const cell = BEAD_RENDER_SIZE; 
      ctx.clearRect(0,0,canvas.width,canvas.height);
      
      beadIndices.forEach((paletteIndex,index)=>{
        if(paletteIndex === null) return;
        const x=(index%size)*cell, y=Math.floor(index/size)*cell;
        drawBead(x,y,cell,palettes[paletteIndex]);
      });

      if (selectedBeadPos !== null && beadIndices[selectedBeadPos] !== null && beadIndices[selectedBeadPos] !== undefined) {
        const x = (selectedBeadPos % size) * cell;
        const y = Math.floor(selectedBeadPos / size) * cell;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = Math.max(3, cell * 0.15);
        ctx.beginPath();
        ctx.arc(x + cell/2, y + cell/2, Math.max(1, cell * 0.38), 0, Math.PI*2);
        ctx.stroke();

        ctx.strokeStyle = '#ff3f88';
        ctx.lineWidth = Math.max(2, cell * 0.08);
        ctx.stroke();
      }
      
      updateCounts();
    }

    function paintDefault(){
      const n=size; beadIndices=[];
      for(let y=0;y<n;y++) for(let x=0;x<n;x++){
        const dx=x-n/2,dy=y-n/2; let index=(x+y)%8;
        if((dx*dx/1.3+dy*dy)<n*n*.16) index=0;
        else if(y>n*.66) index=7;
        else if(x<n*.24&&y<n*.33) index=3;
        else if(x>n*.74&&y<n*.4) index=6;
        beadIndices.push(index);
      }
      selectedBeadPos = null;
      redrawBeads();
      renderPreviewEditor();
    }

    function isLightPixel(r,g,b,a){
      if(a < 32) return true;
      const brightness=(r+g+b)/3, spread=Math.max(r,g,b)-Math.min(r,g,b);
      return brightness>=238 && spread<=18;
    }

    function outerBackgroundMask(data,n){
      const mask=new Uint8Array(n*n), queue=[];
      const add=index=>{
        if(mask[index]) return;
        const k=index*4;
        if(!isLightPixel(data[k],data[k+1],data[k+2],data[k+3])) return;
        mask[index]=1; queue.push(index);
      };
      for(let x=0;x<n;x++){add(x);add((n-1)*n+x);}
      for(let y=1;y<n-1;y++){add(y*n);add(y*n+n-1);}
      for(let head=0;head<queue.length;head++){
        const index=queue[head], x=index%n, y=Math.floor(index/n);
        if(x>0) add(index-1); if(x<n-1) add(index+1);
        if(y>0) add(index-n); if(y<n-1) add(index+n);
      }
      return mask;
    }

    function closestPalette(r,g,b,colors){
      let best=0, min=Infinity;
      colors.forEach(([pr,pg,pb],index)=>{
        const distance=(r-pr)**2+(g-pg)**2+(b-pb)**2;
        if(distance<min){min=distance;best=index;}
      });
      return best;
    }

    // 优化后的降采样逻辑：使用区域块平均采样（Area Sampling）解决轮廓偏差与边缘丢失问题
    function quantizeSourceImage(){
      if(!sourceImage){paintDefault();return;}
      const n = size;
      
      // 创建离屏画布获取完整高精度原图像素
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = sourceImage.width;
      tempCanvas.height = sourceImage.height;
      const tCtx = tempCanvas.getContext('2d', { willReadFrequently: true });
      tCtx.drawImage(sourceImage, 0, 0);
      const imgData = tCtx.getImageData(0, 0, sourceImage.width, sourceImage.height);
      const data = imgData.data;

      // 计算原图等比缩放到 n x n 网格时的偏移与实际占位大小
      const ratio = Math.min(n / sourceImage.width, n / sourceImage.height);
      const scaledW = sourceImage.width * ratio;
      const scaledH = sourceImage.height * ratio;
      const offsetX = (n - scaledW) / 2;
      const offsetY = (n - scaledH) / 2;

      // 建立临时网格存放每个格子的平均颜色与透明度状态
      const gridRawColors = [];
      const colors = paletteRgb();

      const xStep = sourceImage.width / n;
      const yStep = sourceImage.height / n;

      for (let row = 0; row < n; row++) {
        for (let col = 0; col < n; col++) {
          // 将当前网格反算回原图坐标系对应的区块
          let srcStartX = col * xStep;
          let srcEndX = (col + 1) * xStep;
          let srcStartY = row * yStep;
          let srcEndY = (row + 1) * yStep;

          let startX = Math.floor(srcStartX);
          let endX = Math.ceil(srcEndX);
          let startY = Math.floor(srcStartY);
          let endY = Math.ceil(srcEndY);

          startX = Math.max(0, Math.min(startX, sourceImage.width));
          endX = Math.max(0, Math.min(endX, sourceImage.width));
          startY = Math.max(0, Math.min(startY, sourceImage.height));
          endY = Math.max(0, Math.min(endY, sourceImage.height));

          let rSum = 0, gSum = 0, bSum = 0, aSum = 0, count = 0;
          for (let y = startY; y < endY; y++) {
            for (let x = startX; x < endX; x++) {
              const k = (y * sourceImage.width + x) * 4;
              rSum += data[k];
              gSum += data[k + 1];
              bSum += data[k + 2];
              aSum += data[k + 3];
              count++;
            }
          }

          if (count === 0 || (aSum / count) < 32) {
            gridRawColors.push(null);
          } else {
            gridRawColors.push({
              r: Math.round(rSum / count),
              g: Math.round(gSum / count),
              b: Math.round(bSum / count),
              a: aSum / count
            });
          }
        }
      }

      // 结合外围背景过滤逻辑
      // 为保持原有架构兼容，构造一个临时 Uint8Array 传给外围背景遮罩判断
      const flatMaskData = new Uint8Array(n * n * 4);
      for(let i=0; i<n*n; i++){
        const item = gridRawColors[i];
        if(item){
          flatMaskData[i*4] = item.r;
          flatMaskData[i*4+1] = item.g;
          flatMaskData[i*4+2] = item.b;
          flatMaskData[i*4+3] = item.a;
        } else {
          flatMaskData[i*4+3] = 0;
        }
      }
      const outerBackground = outerBackgroundMask(flatMaskData, n);

      beadIndices = [];
      for(let i=0; i<n*n; i++){
        if (outerBackground[i] || !gridRawColors[i]) {
          beadIndices.push(null);
        } else {
          const {r, g, b} = gridRawColors[i];
          beadIndices.push(closestPalette(r, g, b, colors));
        }
      }

      selectedBeadPos = null;
      redrawBeads();
      renderPreviewEditor();
    }

    function updateCounts(){
      const counts=palettes.map(()=>0);
      beadIndices.forEach(index=>{if(index!==null) counts[index]++;});
      $('#countBody').innerHTML=palettes.map((palette,index)=>({palette,count:counts[index]})).filter(item=>item.count).map(({palette,count})=>
        `<tr><td class="code">${palette.id}</td><td><span class="legend-item"><i class="dot" style="background:${palette.color}"></i>${palette.color}</span></td><td><b>${count} 颗</b></td></tr>`
      ).join('') || '<tr><td colspan="3">未识别到需要的拼豆颜色</td></tr>';
      const total=beadIndices.filter(index=>index!==null).length;
      $('#beadTotal').textContent=total; $('#totalBottom').textContent=total+' 颗';
    }

    function renderPreviewEditor(){
      const panel=$('#previewEditor');
      if(selectedBeadPos === null || beadIndices[selectedBeadPos] === null || beadIndices[selectedBeadPos] === undefined) {
          panel.classList.add('empty');
          panel.innerHTML='<span>点击拼豆预览中的圆形色号，即可替换该拼豆颜色</span>';
          return;
      }
      const palette = palettes[beadIndices[selectedBeadPos]];
      panel.classList.remove('empty');
      panel.innerHTML=`
        <span>正在替换该单颗拼豆</span><b id="editorPalId">${palette.id}</b>
        <div class="color-inputs">
            <input id="colorPicker" type="color" value="${palette.color}" aria-label="调色盘">
            <input id="colorHex" type="text" value="${palette.color}" maxlength="7" placeholder="#FFFFFF">
        </div>
        <span class="hint">可输入色号或使用色盘</span>
      `;
      
      const updateColor = (val, isFromPicker) => {
        const hex = val.toUpperCase();
        if(/^#[0-9A-F]{6}$/i.test(hex)){
          let newIndex = palettes.findIndex(p => p.color === hex);
          if (newIndex === -1) {
              newIndex = palettes.length;
              palettes.push({id: 'DIY', name: 'DIY', color: hex});
          }
          beadIndices[selectedBeadPos] = newIndex;
          
          if(!isFromPicker) $('#colorPicker').value = hex;
          $('#editorPalId').textContent = palettes[newIndex].id;
          redrawBeads();
        }
      };

      $('#colorPicker').oninput = e => { updateColor(e.target.value, true); $('#colorHex').value = e.target.value.toUpperCase(); };
      $('#colorHex').oninput = e => updateColor(e.target.value, false);
      $('#colorHex').onchange = e => showToast(`单颗拼豆颜色已更新`);
    }

    function setSize(nextSize){
      size=Math.max(26,Math.min(104,nextSize)); $('#density').value=size;
      $('#densityVal').textContent=`${size} × ${size}`;
      document.querySelectorAll('#sizeButtons button').forEach(button=>button.classList.toggle('active',+button.dataset.size===size));
      quantizeSourceImage();
    }

    $('#previewZoom').oninput=e=>{previewZoom=+e.target.value;$('#zoomValue').textContent=previewZoom+'%';redrawBeads();};
    $('#density').oninput=e=>setSize(+e.target.value);
    $('#sizeButtons').onclick=e=>{if(e.target.tagName==='BUTTON') setSize(+e.target.dataset.size);};
    
    canvas.addEventListener('click',event=>{
      const rect=canvas.getBoundingClientRect();
      const x = Math.floor((event.clientX - rect.left) * size / rect.width);
      const y = Math.floor((event.clientY - rect.top) * size / rect.height);
      const pos = y * size + x;
      const index = beadIndices[pos];
      
      if(index === null || index === undefined){showToast('这里是图像外围背景，不计入拼豆数量');return;}
      
      selectedBeadPos = pos; 
      redrawBeads(); 
      renderPreviewEditor(); 
      showToast(`已选中这颗拼豆 (${palettes[index].id})，可在下方修改独立颜色`);
    });

    function loadImage(file){
      if(!file || !file.type.startsWith('image/')) return;
      const img=new Image(); img.onload=()=>{
        sourceImage=img; $('#sourceImagePreview').src=img.src; $('#sourceImageInfo').textContent=`${img.naturalWidth} × ${img.naturalHeight} 图片将用于生成拼豆图`; $('#sourcePreview').classList.add('show');
        quantizeSourceImage(); showToast('图片已加载，轮廓偏差已通过区域块采样优化！');
      }; img.src=URL.createObjectURL(file);
    }
    
    $('#imageUpload').onchange=e=>loadImage(e.target.files[0]);
    const dz=$('#dropzone');
    ['dragenter','dragover'].forEach(type=>dz.addEventListener(type,event=>{event.preventDefault();dz.classList.add('drag');}));
    ['dragleave','drop'].forEach(type=>dz.addEventListener(type,event=>{event.preventDefault();dz.classList.remove('drag');}));
    dz.addEventListener('drop',event=>loadImage(event.dataTransfer.files[0]));
    $('#generateBtn').onclick=()=>{quantizeSourceImage();showToast(sourceImage?'拼豆图已重新生成！':'已为你生成可爱的示例图！');};
    $('#randomBtn').onclick=()=>{quantizeSourceImage();showToast('已按官方色板重新还原！');};
    
    $('#downloadBtn').onclick=()=>{
        const a=document.createElement('a');
        a.download='专属拼豆图.png';
        a.href=canvas.toDataURL('image/png');
        a.click();
        showToast('图纸已保存到本地');
    };
    paintDefault();
  </script>
</body>
</html>
