    .right-col{padding:20px}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.swatch{aspect-ratio:1;min-width:0;border-radius:8px;border:1px solid rgba(0,0,0,.08);cursor:pointer;transition:.15s;position:relative}.swatch:hover{transform:scale(1.08);z-index:2}.swatch span{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);font-size:8px;font-weight:900;text-shadow:0 1px 3px rgba(0,0,0,.2);color:#fff;opacity:.98;white-space:nowrap}.palette-empty{grid-column:1/-1;padding:14px 10px;border:1px dashed #efdde8;background:#fff9fc;border-radius:12px;text-align:center;color:#a58b9c;font-size:10px}.count-list{margin-top:14px;display:flex;flex-direction:column;gap:7px;max-height:400px;overflow:auto;padding-right:2px}.count-item{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:9px;padding:8px 9px;background:#fafaff;border:1px solid #f0f0f6;border-radius:11px}.mini{width:24px;height:24px;border-radius:7px}.count-item strong{font-size:11px}.count-item span{font-size:9px;color:#9498a8;display:block}.count-item b{font-size:11px}.total{margin-top:12px;padding:12px;border-radius:14px;background:linear-gradient(120deg,#f4f1ff,#fff1f6);display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#878b9e}.total strong{font-size:19px;color:#6e54d7}.note{margin-top:11px;font-size:10px;line-height:1.55;color:#979bad}.empty-count{padding:16px;text-align:center;color:#a0a4b5;font-size:10px;background:#fafaff;border-radius:11px}

<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">✦</span><div>豆豆魔法屋<small>BEAD CREATIVE STUDIO</small></div></div>
    <div class="top-actions"><button class="ghost">我的作品</button><button class="ghost">快捷指南</button></div>
  </header>
<section class="hero" style="display: block; padding: 0; border: none; background: transparent; box-shadow: none; min-height: auto;">
    <img src="banner.png" alt="TZJOY Banner" style="width: 100%; height: auto; border-radius: 30px; display: block; object-fit: cover;">
    
    <!-- 隐藏的容器：保留原有的 ID，防止底部的 JS 代码报错 -->
    <div style="display: none;">
      <b id="heroSize">104 × 104</b>
      <b id="heroTotal">10,816</b>
      <div id="heroThree"></div>
    </div>
  </section>

  <section class="studio">
    <aside class="panel side">
      <div class="section-head"><h2>创作设置</h2><span class="step">01</span></div>
      <label class="drop" id="dropzone" for="imageUpload"><div class="drop-icon">↥</div><h3>拖入图片，或点击此区域上传</h3><p>JPG / PNG / WEBP · 自动实时生成</p><input id="imageUpload" type="file" accept="image/*"></label>
      <div class="source" id="sourcePreview"><img id="sourceImagePreview" alt="原始图片"><div><b>已载入原图</b><span id="sourceImageInfo">准备生成</span></div></div>
      <div class="field"><label>拼豆规格 <span id="densityVal">104 × 104</span></label><div class="seg" id="sizeButtons"><button data-size="26">26</button><button data-size="36">36</button><button data-size="52">52</button><button data-size="78">78</button><button data-size="104" class="active">104</button></div></div>
      <div class="field"><label>颗粒密度 <span id="densityLabel">104 格</span></label><input class="range" id="density" type="range" min="26" max="104" value="104"></div>
      <div class="actions"><button class="outline2" id="eraserBtn">⌫ 橡皮擦</button><button class="outline2" id="undoEraseBtn" disabled>↶ 撤销</button></div>
      <div class="hint-box">交互提示：点击单颗豆子可修改颜色；滚动鼠标缩放图纸。</div>
    </aside>

    <main class="panel main-panel">
      <div class="main-head"><div class="main-title"><span class="step">02</span><div><h2>拼豆预览</h2><span class="kicker">实时预览 · 逐颗编辑</span></div><span class="badge">共 <b id="beadTotal">10,816</b> 颗</span></div></div>
      <div class="viewer" id="viewer"><div class="canvas2d" id="canvas2d"><canvas id="beadCanvas"></canvas></div><div class="viewer-tip" id="viewerTip">滚轮缩放 / 拖拽平移 · 点击单颗拼豆编辑</div></div>
      <div class="zoom-row"><span>预览缩放</span><input id="previewZoom" type="range" min="30" max="220" value="100"><b id="zoomValue">100%</b></div>
      <div class="editor empty" id="previewEditor">点击预览中的拼豆，可直接修改这一颗的颜色</div>
      <div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="outline2" id="downloadBtn">⇩ 保存 PNG 图纸</button></div>
    </main>

    <aside class="panel right-col">
      <div class="section-head"><h2>材料面板</h2><span class="step">03</span></div>
      <div class="kicker" style="margin-bottom:8px">当前色板</div><div class="palette" id="palette"></div>
      <div class="kicker" style="margin:18px 0 8px">颜色用量</div><div class="count-list" id="countBody"></div>
      <div class="total"><span>预计需要</span><strong id="totalBottom">10,816</strong><span>+5%</span></div>
      <div class="note">色号来自页面内置色板。动态 Banner 仅用于增加创作氛围，不影响图纸编辑。</div>
    </aside>
  </section>
</div>
<div class="toast" id="toast"></div>

/* ---------- Lab 色彩空间 ---------- */
function rgbToLab(r, g, b) {
  let r_ = r / 255, g_ = g / 255, b_ = b / 255;
  r_ = r_ > 0.04045 ? Math.pow((r_ + 0.055) / 1.055, 2.4) : r_ / 12.92;

let masterImageCanvas = null;
let globalMajorColors = [];

/* =========================================================
   104 母版生成
   ========================================================= */
function processMasterImage() {
  if (!sourceImage) return;
  const n = 104;

  masterImageCanvas = document.createElement('canvas');
  masterImageCanvas.width = n;
  masterImageCanvas.height = n;
  const mctx = masterImageCanvas.getContext('2d', { willReadFrequently: true });

  const sw = sourceImage.width, sh = sourceImage.height;
  const ratio = Math.min(n / sw, n / sh);
  const dw = sw * ratio, dh = sh * ratio;
  const ox = (n - dw) / 2, oy = (n - dh) / 2;

  mctx.imageSmoothingEnabled = false;
  mctx.clearRect(0, 0, n, n);
  mctx.drawImage(sourceImage, ox, oy, dw, dh);

  const imgData = mctx.getImageData(0, 0, n, n);
  const data = imgData.data;
  const bg = bgMask(data, n);

  const raw104 = new Array(n * n).fill(null);
  const colorCounts = {};
  let totalValid = 0;

  for (let i = 0; i < n * n; i++) {
    if (bg[i]) continue;
    if (data[i * 4 + 3] < 30) continue;
    const pIdx = closestPalette(data[i * 4], data[i * 4 + 1], data[i * 4 + 2]);
    raw104[i] = pIdx;
    colorCounts[pIdx] = (colorCounts[pIdx] || 0) + 1;
    totalValid++;
  }

  if (!totalValid) { masterIndices = raw104; globalMajorColors = []; return; }

  /* 主色板过滤 + 聚类去杂 */
  const threshold = Math.max(3, totalValid * 0.003);
  let initialColors = Object.keys(colorCounts)
    .map(Number)
    .filter(p => colorCounts[p] >= threshold);

  initialColors.sort((a, b) => colorCounts[b] - colorCounts[a]);

  const consolidatedColors = [];
  for (const cIdx of initialColors) {
    const lab1 = paletteLabCache[cIdx];
    let tooClose = false;
    for (const kept of consolidatedColors) {
      if (labDist(lab1, paletteLabCache[kept]) < 15) { tooClose = true; break; }
    }
    if (!tooClose) consolidatedColors.push(cIdx);
  }
  globalMajorColors = consolidatedColors.length ? consolidatedColors : [initialColors[0]];

  /* 母版：把每个有效像素收敛到主色板 */
  masterIndices = new Array(n * n).fill(null);
  for (let i = 0; i < n * n; i++) {
    if (raw104[i] === null) continue;
    const pIdx = raw104[i];
    if (globalMajorColors.includes(pIdx)) {
      masterIndices[i] = pIdx;
    } else {
      let best = globalMajorColors[0], bestD = Infinity;

      masterIndices[i] = best;

/* =========================================================
   特征感知降采样 + 轮廓统一
   ---------------------------------------------------------
   26/36 的核心修复：
   每个格子内找出「特征分数最高」的像素。如果它的分数
   明显高于该格子平均值（≥2.5 倍）且绝对值足够高（≥20），
   就直接采用它的颜色——这就是特征优先采样，可以让眼睛、
   鼻孔、「2019」等小细节在极小尺寸下也能保留。
   否则退回加权投票。
   ========================================================= */
const FEATURE_THRESHOLD = 20;        // 特征优先的绝对分数阈值
const FEATURE_DOMINANCE = 2.5;       // 特征优先的相对优势阈值

function quantizeSourceImage() {
  if (!masterIndices || !masterIndices.length) { paintDefault(); return; }

  const n = size;
  const M = 104;
  const ratio = M / n;

  /* 1. 标记母版最外层轮廓像素 */
  const masterBoundary = new Uint8Array(M * M);
  for (let y = 0; y < M; y++) {
    for (let x = 0; x < M; x++) {
      const i = y * M + x;
      if (masterIndices[i] === null) continue;
      let isEdge = (x === 0 || y === 0 || x === M - 1 || y === M - 1);
      if (!isEdge) {
        if (masterIndices[i - M] === null || masterIndices[i + M] === null ||
            masterIndices[i - 1] === null || masterIndices[i + 1] === null) isEdge = true;
      }
      if (isEdge) masterBoundary[i] = 1;
    }
  }

  /* 2. 统一母版轮廓色 */
  const unified = masterIndices.slice();
  const edgeColorCounts = {};
  for (let i = 0; i < M * M; i++) {
    if (!masterBoundary[i]) continue;
    const c = unified[i];
    if (c === null) continue;
    edgeColorCounts[c] = (edgeColorCounts[c] || 0) + 1;
  }
  let outlineColorIdx = null, maxEdge = 0;
  for (const k in edgeColorCounts) {
    if (edgeColorCounts[k] > maxEdge) { maxEdge = edgeColorCounts[k]; outlineColorIdx = Number(k); }
  }
  if (outlineColorIdx !== null) {
    const domLab = paletteLabCache[outlineColorIdx];
    const domChroma = Math.sqrt(domLab[1] * domLab[1] + domLab[2] * domLab[2]);
    const domHue = Math.atan2(domLab[2], domLab[1]);
    const NEUTRAL_CHROMA = 15;
    for (let i = 0; i < M * M; i++) {
      if (!masterBoundary[i]) continue;
      const c = unified[i];
      if (c === null || c === outlineColorIdx) continue;
      const lab = paletteLabCache[c];
      const chroma = Math.sqrt(lab[1] * lab[1] + lab[2] * lab[2]);
      if (domChroma < NEUTRAL_CHROMA && chroma < NEUTRAL_CHROMA) {
        unified[i] = outlineColorIdx;
      } else if (domChroma >= NEUTRAL_CHROMA && chroma >= NEUTRAL_CHROMA) {
        let dh = Math.abs(Math.atan2(lab[2], lab[1]) - domHue);
        if (dh > Math.PI) dh = 2 * Math.PI - dh;
        if (dh < Math.PI / 6) unified[i] = outlineColorIdx;
      }
    }
  }

  /* 3. 特征分数（5×5 邻域 Lab 距离） */
  const featureScore = new Float32Array(M * M);
  for (let y = 0; y < M; y++) {
    for (let x = 0; x < M; x++) {
      const i = y * M + x;

          const nc = unified[ny * M + nx];

        }

      const avgLab = [sumL / cnt, sumA / cnt, sumB / cnt];
      featureScore[i] = labDist(lab, avgLab);
    }
  }

  /* 4. 降采样：轮廓优先 > 特征优先 > 加权投票 */
  const next = new Array(n * n).fill(null);

  for (let y = 0; y < n; y++) {
    const sy0 = Math.floor(y * ratio);
    const sy1 = Math.max(sy0 + 1, Math.floor((y + 1) * ratio));
    for (let x = 0; x < n; x++) {
      const sx0 = Math.floor(x * ratio);
      const sx1 = Math.max(sx0 + 1, Math.floor((x + 1) * ratio));

      const counts = {};
      const maxFeature = {};
      const edgeCounts = {};
      let maxFS = 0, maxFSColor = null;
      let totalFS = 0, totalCount = 0;

      // 优先级 1：格子内出现轮廓像素 → 使用轮廓色

      for (const k in edgeCounts) {

      }

      if (edgeDom !== null) {
        result = edgeDom;
      } else {
        // 优先级 2：特征优先——格子内有"显著突出"的像素时直接选用
        const avgFS = totalCount > 0 ? totalFS / totalCount : 0;
        const featureDominant =
          maxFS >= FEATURE_THRESHOLD &&
          maxFSColor !== null &&
          maxFS > avgFS * FEATURE_DOMINANCE;

        if (featureDominant) {
          result = maxFSColor;
        } else {
          // 优先级 3：加权投票
          let bestC = null, bestScore = 0;
          for (const k in counts) {

          }
          result = bestC;
        }
      }

      next[y * n + x] = result;
    }

  beadIndices = next;
  selectedBeadPos = null;
  eraseHistory = [];
  updateUndoBtn();
  redrawBeads();
  renderPreviewEditor();
}

function renderPreviewEditor(){
  const panel=$('#previewEditor');
  if(eraserMode){
    panel.classList.add('empty');
    panel.textContent='橡皮擦已开启：点击单颗豆子即可删除，可撤销。';
    return;
  }
  if(selectedBeadPos==null||beadIndices[selectedBeadPos]==null){
    panel.classList.add('empty');
    panel.textContent='点击预览中的拼豆，可直接修改这一颗的颜色';
    return;
  }
  const p=palettes[beadIndices[selectedBeadPos]];
  panel.classList.remove('empty');
  panel.innerHTML=`<div class="editor-row"><span>当前颜色</span><b id="editorPalId">${p.id}</b><input id="colorPicker" class="color-picker" type="color" value="${p.color}"><input id="colorHex" class="hex" value="${p.color}"><span class="editor-hint">输入色值或使用色盘</span></div>`;

  const update=v=>{
    v=v.toUpperCase();
    if(/^#[0-9A-F]{6}$/i.test(v)){
      let ni=palettes.findIndex(x=>x.color===v);
      if(ni<0){
        const cx=selectedBeadPos%size;
        const cy=Math.floor(selectedBeadPos/size);
        const neighborIndices={};
        for(let dy=-1;dy<=1;dy++){
          for(let dx=-1;dx<=1;dx++){
            if(dx===0&&dy===0)continue;
            const nx=cx+dx,ny=cy+dy;
            if(nx>=0&&nx<size&&ny>=0&&ny<size){
              const nIndex=beadIndices[ny*size+nx];
              if(nIndex!=null){neighborIndices[nIndex]=(neighborIndices[nIndex]||0)+1;}
            }
          }
        }
        const keys=Object.keys(neighborIndices);
        if(keys.length>0){
          keys.sort((a,b)=>neighborIndices[b]-neighborIndices[a]);
          ni=+keys[0];

          const r=parseInt(v.slice(1,3),16),g=parseInt(v.slice(3,5),16),b=parseInt(v.slice(5,7),16);

      $('#editorPalId').textContent=palettes[ni].id;
      $('#colorPicker').value=palettes[ni].color;
      $('#colorHex').value=palettes[ni].color;
      redrawBeads();
    }

$('#eraserBtn').onclick=()=>setEraser(!eraserMode);
$('#undoEraseBtn').onclick=()=>{if(!eraseHistory.length)return;const x=eraseHistory.pop();beadIndices[x.pos]=x.index;selectedBeadPos=null;updateUndoBtn();redrawBeads();renderPreviewEditor();showToast(`已恢复 ${palettes[x.index].id}`)};
canvas.addEventListener('click',e=>{const r=canvas.getBoundingClientRect();const x=Math.floor((e.clientX-r.left)*size/r.width),y=Math.floor((e.clientY-r.top)*size/r.height);if(x<0||y<0||x>=size||y>=size)return;const pos=y*size+x,idx=beadIndices[pos];if(idx==null){showToast('这里是背景区域');return}if(eraserMode){eraseHistory.push({pos,index:idx});beadIndices[pos]=null;selectedBeadPos=null;updateUndoBtn();redrawBeads();renderPreviewEditor();showToast(`已擦除 ${palettes[idx].id}`);return}selectedBeadPos=pos;redrawBeads();renderPreviewEditor()});
document.getElementById('palette').addEventListener('click',e=>{const b=e.target.closest('.swatch');if(!b||selectedBeadPos==null)return;const i=+b.dataset.pidx;beadIndices[selectedBeadPos]=i;redrawBeads();renderPreviewEditor();showToast(`已改为 ${palettes[i].id}`)});
$('#downloadBtn').onclick=()=>{const a=document.createElement('a');a.download='TZJOY-拼豆图纸.png';a.href=canvas.toDataURL('image/png');a.click();showToast('PNG 图纸已保存')};

paintDefault();

/* =========================================================
   Hero 3D
   ========================================================= */
let heroThreeReady=false;
function initHeroThree(){
  const host=document.getElementById('heroThree'); if(!host || heroThreeReady) return;
  const load=()=>{
    import('https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js').then(THREE=>{
      const scene=new THREE.Scene();
      const camera=new THREE.PerspectiveCamera(38,Math.max(host.clientWidth,1)/Math.max(host.clientHeight,1),.1,100);
      camera.position.z=15;
      const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
      renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(host.clientWidth,host.clientHeight); renderer.outputColorSpace=THREE.SRGBColorSpace;
      host.appendChild(renderer.domElement);
      const group=new THREE.Group(); scene.add(group);
      const geo=new THREE.SphereGeometry(.16,14,14);
      const colors=['#ff7eb6','#f9a7c9','#c79afc','#ffd37d','#fff0a8','#bde8ff','#f6c7ff'];
      const beads=[]; const count=92;
      for(let i=0;i<count;i++){
        const a=i/count*Math.PI*2; const r=3.55 + Math.sin(i*.7)*.38;
        const x=Math.cos(a)*r*.95; const y=Math.sin(a)*r*.65;
        const m=new THREE.MeshBasicMaterial({color:colors[i%colors.length],transparent:true,opacity:.95});
        const bead=new THREE.Mesh(geo,m); bead.position.set(x,y,(Math.sin(i*1.7)*.45)); bead.userData.base=bead.position.clone(); bead.userData.phase=i*.29; group.add(bead); beads.push(bead);
      }
      const core=new THREE.Mesh(new THREE.IcosahedronGeometry(1.55,2),new THREE.MeshBasicMaterial({color:'#fff6fb',transparent:true,opacity:.72})); group.add(core);
      const pointer={x:0,y:0,down:false};
      const onPointer=(e)=>{const r=host.getBoundingClientRect(); pointer.x=((e.clientX-r.left)/r.width-.5)*2; pointer.y=((e.clientY-r.top)/r.height-.5)*-2};
      host.addEventListener('pointermove',onPointer);
      host.addEventListener('pointerleave',()=>{pointer.x=0;pointer.y=0});
      host.addEventListener('click',()=>{for(const b of beads){b.userData.burst=1.0}});
      const clock=new THREE.Clock();
      function animate(){
        requestAnimationFrame(animate);
        const t=clock.getElapsedTime();
        group.rotation.y=t*.15 + pointer.x*.4;
        group.rotation.x=t*.1 + pointer.y*.4;
        for(let i=0;i<beads.length;i++){
          const b=beads[i]; const s=Math.sin(t*2+b.userData.phase)*.12;
          b.position.z=b.userData.base.z + s;
          if(b.userData.burst){
            b.userData.burst-=0.03;
            b.scale.setScalar(1 + b.userData.burst*1.5);
          }else{
            b.scale.setScalar(1);
          }
        }
        renderer.render(scene,camera);
      }
      animate();
      heroThreeReady=true;
    }).catch(()=>{});
  };
  if(window.IntersectionObserver){
    new IntersectionObserver((entries,obs)=>{
      if(entries[0].isIntersecting){ load(); obs.disconnect(); }
    },{threshold:0.1}).observe(host);
  }else{ load(); }
}
setTimeout(initHeroThree, 300);
</script>
